<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">OmniMedia — Universal Social Media API</title>
  <desc id="desc">Parse public media links from 39 platforms with one normalized API.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset=".55" stop-color="#101b38"/><stop offset="1" stop-color="#061f2c"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#6366f1"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="56"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="980" cy="-20" r="240" fill="#22d3ee" opacity=".16" filter="url(#blur)"/>
  <circle cx="180" cy="650" r="260" fill="#4f46e5" opacity=".18" filter="url(#blur)"/>
  <g opacity=".12" stroke="#cbd5e1"><path d="M0 110h1200M0 220h1200M0 330h1200M0 440h1200M0 550h1200"/><path d="M120 0v630M300 0v630M480 0v630M660 0v630M840 0v630M1020 0v630"/></g>
  <g transform="translate(92 102)"><rect width="66" height="66" rx="18" fill="url(#accent)"/><path d="M19 35 33 21l14 14-14 14z" fill="#fff"/><circle cx="33" cy="35" r="7" fill="#07111f"/></g>
  <text x="182" y="149" fill="#f8fafc" font-family="ui-sans-serif,system-ui,sans-serif" font-size="38" font-weight="800" letter-spacing="-1">OmniMedia</text>
  <text x="92" y="283" fill="#f8fafc" font-family="ui-sans-serif,system-ui,sans-serif" font-size="68" font-weight="900" letter-spacing="-2">One link.</text>
  <text x="92" y="359" fill="#67e8f9" font-family="ui-sans-serif,system-ui,sans-serif" font-size="68" font-weight="900" letter-spacing="-2">Every platform.</text>
  <text x="96" y="421" fill="#cbd5e1" font-family="ui-sans-serif,system-ui,sans-serif" font-size="24">Parse, normalize, and download public media across 39 platforms.</text>
  <g transform="translate(96 495)"><rect width="260" height="52" rx="26" fill="url(#accent)"/><text x="130" y="34" text-anchor="middle" fill="#fff" font-family="ui-sans-serif,system-ui,sans-serif" font-size="17" font-weight="800">useomnimedia.com</text></g>
  <text x="1090" y="570" text-anchor="end" fill="#94a3b8" font-family="ui-monospace,SFMono-Regular,monospace" font-size="16" letter-spacing="2">REST · JSON · DOWNLOADS</text>
</svg>
